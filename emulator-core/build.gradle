plugins {
    alias(libs.plugins.android.library)
}

// :emulator-core owns the native build (CMake -> libe.so + libhardware_ProcessorInfo.so)
// and the JNI-bound Java classes, so the heavy native tree builds exactly once and
// the app module (:app) consumes it transitively.
//
// namespace is xendroid.compose.core (NOT xendroid.compose) -- AGP forbids two modules sharing
// a namespace. The moved JNI classes keep their own `package xendroid.compose[.*]` (the
// native side binds by FQN, unaffected by the module namespace). DocumentsProvider's
// unqualified R is resolved via `import xendroid.compose.core.R;`.
android {
    namespace 'xendroid.compose.core'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        // 29+ gives native ELF TLS (thread_local = register read, not an emutls call).
        minSdk 29

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                // Optimize host code in all variants; -g kept for simpleperf;
                // -fno-strict-aliasing for the raw-memory-reinterpretation code.
                cFlags '-O2', '-DNDEBUG', '-g', '-fno-strict-aliasing'
                cppFlags '-O2', '-DNDEBUG', '-g', '-fno-strict-aliasing'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.30.3'
        }
    }
}

dependencies {
    // `api` so consumers (the JNI bridge uses DocumentFile; Application uses WindowCompat)
    // get these transitively.
    api libs.appcompat
    api libs.documentfile
}
