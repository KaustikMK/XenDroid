name: XenDroid

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xendroid-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_API_LEVEL: '35'
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_CMAKE_VERSION: 3.30.3
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  USE_CCACHE: 'true'
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CMAKE_BUILD_PARALLEL_LEVEL: '3'

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android and shader toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 glslang-tools spirv-tools
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Generate local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "cmake.dir=${ANDROID_HOME}/cmake/${ANDROID_CMAKE_VERSION}"
          } > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-strict-match: false
          # Third-party submodules can contain Gradle wrappers that are not used by
          # the XenDroid build and may not be in Gradle's checksum allowlist.
          validate-wrappers: false

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-arm64
          max-size: 2G

      - name: Compute artifact metadata
        id: metadata
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build APKs and app bundle
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease \
            -PgitHash=${{ steps.metadata.outputs.sha_short }} \
            --build-cache \
            --parallel \
            --max-workers=$(nproc) \
            --no-daemon

      - name: Sign release APK when signing secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Signing secrets are not fully configured; keeping unsigned release APK."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          unsigned_apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          signed_apk="app/build/outputs/apk/release/XenDroid-release-signed.apk"
          cp "$unsigned_apk" "$signed_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$signed_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$signed_apk"

      - name: Collect build artifacts
        run: |
          set -euo pipefail
          artifact_dir="artifacts/XenDroid_${{ steps.metadata.outputs.sha_short }}"
          mkdir -p "$artifact_dir"
          find app/build/outputs \
            \( -name '*.apk' -o -name '*.aab' -o -name 'mapping.txt' -o -name 'seeds.txt' -o -name 'usage.txt' \) \
            -type f -print -exec cp --parents {} "$artifact_dir" \;
          find emulator-core/build/intermediates \
            \( -name '*.so' -o -name '*.aar' \) \
            -type f -print -exec cp --parents {} "$artifact_dir" \; || true
          (cd artifacts && zip -r "XenDroid_${{ steps.metadata.outputs.sha_short }}_all_artifacts.zip" "XenDroid_${{ steps.metadata.outputs.sha_short }}")

      - name: Upload all build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XenDroid_${{ steps.metadata.outputs.sha_short }}_all_artifacts
          path: |
            artifacts/XenDroid_${{ steps.metadata.outputs.sha_short }}
            artifacts/XenDroid_${{ steps.metadata.outputs.sha_short }}_all_artifacts.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: XenDroid-${{ steps.metadata.outputs.sha_short }}
          name: XenDroid ${{ steps.metadata.outputs.sha_short }}
          generate_release_notes: true
          files: artifacts/XenDroid_${{ steps.metadata.outputs.sha_short }}_all_artifacts.zip
